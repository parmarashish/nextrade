name: Daily Database Reseed

on:
  schedule:
    # Runs at 00:00 UTC (05:30 AM IST) every day
    - cron: '0 0 * * *'
  # Enables manual one-click trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  reseed:
    name: Reseed Demo Database
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Database Reseed
        run: |
          echo "Sending automated reseed request to NexTrade Production API..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://nextrade-u401.onrender.com/api/system/reseed" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response HTTP Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Database reseed failed with HTTP status $STATUS"
            exit 1
          fi

          echo "✅ Database reseed completed successfully!"
